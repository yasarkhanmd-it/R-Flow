version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: rflow-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  gateway-service:
    build:
      context: .
      dockerfile: services/gateway-service/Dockerfile
    container_name: rflow-gateway-service
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - AUTH_SERVICE_URL=http://auth-service:5001
      - PROJECT_SERVICE_URL=http://project-service:5002
      - STORY_SERVICE_URL=http://story-service:5003
      - TASK_SERVICE_URL=http://task-service:5004
      - NOTIFICATION_SERVICE_URL=http://notification-service:5005
      - DASHBOARD_SERVICE_URL=http://dashboard-service:5006
      - REPORT_SERVICE_URL=http://report-service:5007
    depends_on:
      - auth-service
      - project-service
      - story-service
      - task-service
      - notification-service
      - dashboard-service
      - report-service

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: rflow-auth-service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGO_URI=mongodb://mongodb:27017/rflow
      - JWT_SECRET=rflow_super_secret_jwt_key_2026
    depends_on:
      - mongodb

  project-service:
    build:
      context: .
      dockerfile: services/project-service/Dockerfile
    container_name: rflow-project-service
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - MONGO_URI=mongodb://mongodb:27017/rflow
      - JWT_SECRET=rflow_super_secret_jwt_key_2026
    depends_on:
      - mongodb

  story-service:
    build:
      context: .
      dockerfile: services/story-service/Dockerfile
    container_name: rflow-story-service
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - MONGO_URI=mongodb://mongodb:27017/rflow
      - JWT_SECRET=rflow_super_secret_jwt_key_2026
    depends_on:
      - mongodb

  task-service:
    build:
      context: .
      dockerfile: services/task-service/Dockerfile
    container_name: rflow-task-service
    ports:
      - "5004:5004"
    environment:
      - PORT=5004
      - MONGO_URI=mongodb://mongodb:27017/rflow
      - JWT_SECRET=rflow_super_secret_jwt_key_2026
    depends_on:
      - mongodb

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: rflow-notification-service
    ports:
      - "5005:5005"
    environment:
      - PORT=5005
      - MONGO_URI=mongodb://mongodb:27017/rflow
      - JWT_SECRET=rflow_super_secret_jwt_key_2026
    depends_on:
      - mongodb

  dashboard-service:
    build:
      context: .
      dockerfile: services/dashboard-service/Dockerfile
    container_name: rflow-dashboard-service
    ports:
      - "5006:5006"
    environment:
      - PORT=5006
      - MONGO_URI=mongodb://mongodb:27017/rflow
      - JWT_SECRET=rflow_super_secret_jwt_key_2026
    depends_on:
      - mongodb

  report-service:
    build:
      context: .
      dockerfile: services/report-service/Dockerfile
    container_name: rflow-report-service
    ports:
      - "5007:5007"
    environment:
      - PORT=5007
      - MONGO_URI=mongodb://mongodb:27017/rflow
      - JWT_SECRET=rflow_super_secret_jwt_key_2026
    depends_on:
      - mongodb

volumes:
  mongodb_data:
