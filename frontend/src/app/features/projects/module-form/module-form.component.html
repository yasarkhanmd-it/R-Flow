<div class="modal-overlay" (click)="onClose()">
  <div class="modal-container" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ module ? 'Edit Module' : 'Create New Module' }}</h2>
      <button class="btn-close" (click)="onClose()">
        <lucide-icon [img]="X" [size]="20"></lucide-icon>
      </button>
    </div>

    <form [formGroup]="moduleForm" (ngSubmit)="onSubmit()" class="modal-body">
      <div *ngIf="error" class="alert alert-danger" style="margin-bottom: 1rem; padding: 0.75rem; background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; border-radius: 4px;">
        {{ error }}
      </div>

      <div class="form-group" style="margin-bottom: 1rem;">
        <label for="name" style="display: block; font-weight: 500; margin-bottom: 0.5rem;">Module Name <span class="text-danger">*</span></label>
        <input 
          id="name" 
          type="text" 
          formControlName="name" 
          class="form-control" 
          style="width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 4px;"
          placeholder="e.g. Authentication"
          [class.is-invalid]="moduleForm.get('name')?.invalid && moduleForm.get('name')?.touched">
        <div class="invalid-feedback" *ngIf="moduleForm.get('name')?.invalid && moduleForm.get('name')?.touched" style="color: #dc2626; font-size: 0.75rem; margin-top: 0.25rem;">
          Module name is required (min 3 characters).
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 1rem;">
        <label for="description" style="display: block; font-weight: 500; margin-bottom: 0.5rem;">Description</label>
        <textarea 
          id="description" 
          formControlName="description" 
          class="form-control" 
          style="width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 4px; min-height: 80px;"
          placeholder="What is this module about?"></textarea>
      </div>

      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label for="dueDate" style="display: block; font-weight: 500; margin-bottom: 0.5rem;">Expected Due Date</label>
        <input 
          id="dueDate" 
          type="date" 
          formControlName="dueDate" 
          class="form-control"
          style="width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 4px;">
      </div>

      <div class="modal-footer" style="display: flex; justify-content: flex-end; gap: 1rem; border-top: 1px solid #e5e7eb; padding-top: 1rem;">
        <button type="button" class="btn btn-outline" (click)="onClose()" style="padding: 0.5rem 1rem; border: 1px solid #d1d5db; background: white; border-radius: 4px; cursor: pointer;">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="moduleForm.invalid || isSubmitting" style="padding: 0.5rem 1rem; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer;">
          {{ isSubmitting ? 'Saving...' : (module ? 'Update Module' : 'Create Module') }}
        </button>
      </div>
    </form>
  </div>
</div>
